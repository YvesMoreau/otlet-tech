# Site-wide switches.
# menu: "tabs" draws the menu as index-card divider tabs (css/tabs.css and
# _includes/nav-tabs.html). Any other value, or deleting this file, restores the
# template B top-bar menu with ring markers.
menu: tabs

# Advocacy items name people or organizations, so each goes live only on the
# founder's sign-off. false: shown in local previews (jekyll serve), left out of
# the production build (GitHub Pages builds with JEKYLL_ENV=production).
publish_belarus: false
