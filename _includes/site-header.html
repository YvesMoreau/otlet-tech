<header class="topbar">
  <div class="wrap">
    <a class="logo" href="{{ '/home/' | relative_url }}" aria-label="{{ site.title }} home">
      <img src="{{ '/assets/otlet-wordmark.webp' | relative_url }}" alt="{{ site.title }}" width="417" height="96">
      <span class="tagline"><b>{{ site.expansion }}</b><i>{{ site.tagline }}</i></span>
    </a>
    {%- if site.data.options.menu == "tabs" %}
    {% include nav-tabs.html %}
    {%- else %}
    <nav class="menu" aria-label="Main">
      <ul>
        {%- for item in site.data.nav %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
    {%- endif %}
  </div>
</header>
