<nav class="tabs" aria-label="Main">
    <ul>
      {%- for item in site.data.nav %}
      <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}><span class="tab-index">{{ item.index }}</span>{{ item.title }}</a></li>
      {%- endfor %}
    </ul>
  </nav>
